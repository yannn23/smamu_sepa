<!DOCTYPE html>
<html lang="id">
<head>
<title>Sistem Absensi Sekolah</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
body{font-family:Arial;background:#f0f2f5;padding:20px}
.login-box,.dashboard{max-width:600px;margin:auto;background:white;padding:20px;border-radius:10px;box-shadow:0 2px 10px #ccc}
button{padding:10px 15px;margin:5px;background:#1a73e8;color:white;border:none;border-radius:5px;cursor:pointer}
.hidden{display:none}
#reader{width:100%;}
</style>
</head>
<body>

<h1 style="text-align:center;"> SISTEM ABSENSI SEKOLAH</h1>

<!-- 1. HALAMAN LOGIN -->
<div class="login-box" id="login">
  <h2>Login</h2>
  <select id="role">
    <option value="admin">Admin</option>
    <option value="guru">Guru</option>
    <option value="siswa">Siswa</option>
  </select><br><br>
  <input type="text" id="user" placeholder="Username/NIS"><br><br>
  <input type="password" id="pass" placeholder="Password"><br><br>
  <button onclick="login()">Masuk</button>
  <p id="error" style="color:red"></p>
</div>


<!-- 2. DASHBOARD ADMIN -->
<div class="dashboard hidden" id="dashboard-admin">
  <h2>Dashboard Admin</h2>
  <button onclick="showTab('kelola')">Kelola Guru & Siswa</button>
  <button onclick="showTab('rekap')">Lihat Semua Absen</button>
  <button onclick="logout()">Logout</button>
</div>

<!-- 3. DASHBOARD GURU -->
<div class="dashboard hidden" id="dashboard-guru">
  <h2>Dashboard Guru: <span id="namaGuru"></span></h2>
  <button onclick="startScan('siswa')">Scan Absen Siswa</button>
  <button onclick="startScan('guru')">Absen Masuk Guru</button>
  <button onclick="showTab('edit')">Edit Absen Siswa</button>
  <button onclick="logout()">Logout</button>
  <div id="reader" class="hidden"></div>
</div>

<!-- 4. DASHBOARD SISWA -->
<div class="dashboard hidden" id="dashboard-siswa">
  <h2>Dashboard Siswa: <span id="namaSiswa"></span></h2>
  <button onclick="startScan('siswa')">Scan Absen Saya</button>
  <button onclick="lihatRiwayat()">Lihat Keaktifan Saya</button>
  <button onclick="logout()">Logout</button>
  <div id="riwayat"></div>
  <div id="reader" class="hidden"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyPVBSWsLDyWK4d9sRRyCAnD8YSb-u2oAaGXqZuO5VGB4SjM3QQJGzoO9WlZUeTFf3e/exec";
let currentUser = {};
let html5QrCode;

// FUNGSI LOGIN - Ngecek ke Google Sheet
function login(){
  const role = document.getElementById('role').value;
  const user = document.getElementById('user').value;
  const pass = document.getElementById('pass').value;
  
  fetch(`${SCRIPT_URL}?action=login&role=${role}&user=${user}&pass=${pass}`)
  .then(res => res.json())
  .then(data => {
    if(data.status == "sukses"){
      currentUser = data;
      document.getElementById('login').classList.add('hidden');
      document.getElementById('dashboard-'+role).classList.remove('hidden');
      if(role=='guru') document.getElementById('namaGuru').innerText = data.nama;
      if(role=='siswa') document.getElementById('namaSiswa').innerText = data.nama;
    } else {
      document.getElementById('error').innerText = "Login gagal";
    }
  })
}

// FUNGSI SCAN BARCODE
function startScan(tipe){
  document.getElementById('reader').classList.remove('hidden');
  html5QrCode = new Html5Qrcode("reader");
  html5QrCode.start({ facingMode: "environment" }, { fps: 10 }, (nis)=>{
    // Kirim ke Google Sheet: siapa yg scan, nis siapa, role siapa
    fetch(`${SCRIPT_URL}?action=absen&tipe=${tipe}&nis=${nis}&oleh=${currentUser.user}`)
    .then(res=>res.text()).then(alert);
    html5QrCode.stop();
    document.getElementById('reader').classList.add('hidden');
  });
}

function logout(){
  location.reload();
}
</script>
</body>
</html>
