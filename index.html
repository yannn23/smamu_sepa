<!DOCTYPE html>
<html>
<head>
  <title>Absensi Online</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial; background: #f2f2f2; text-align: center; padding-top: 50px; }
    .login-box, .dashboard { background: white; padding: 20px; border-radius: 10px; width: 350px; margin: auto; box-shadow: 0 0 10px #ccc; }
    .hidden { display: none; }
    input, select, button { width: 90%; padding: 10px; margin: 5px 0; border-radius: 5px; border: 1px solid #ccc; }
    button { background: #4CAF50; color: white; cursor: pointer; border: none; }
    button:hover { background: #45a049; }
    button.danger { background: red; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    table, th, td { border: 1px solid #ddd; }
    th, td { padding: 8px; text-align: center; }
  </style>
</head>
<body>

  <!-- 1. HALAMAN LOGIN -->
  <div class="login-box" id="login">
    <h2>Login Absensi</h2>
    <select id="role">
      <option value="admin">Admin</option>
      <option value="guru">Guru</option>
      <option value="siswa">Siswa</option>
    </select><br>
    <input type="text" id="user" placeholder="Username/NIS"><br>
    <input type="password" id="pass" placeholder="Password"><br>
    <button onclick="login()">Masuk</button>
    <p id="error" style="color:red"></p>
  </div>

  <!-- 2. HALAMAN ADMIN -->
  <div class="dashboard hidden" id="adminMenu">
    <h2>Menu Admin</h2>
    <button onclick="showKelola('guru')">Kelola Guru</button>
    <button onclick="showKelola('siswa')">Kelola Siswa</button>
    <button onclick="logout()" class="danger">Logout</button>
    <hr>
    <div id="kelolaArea"></div> <!-- ini buat nampilin form + tabel -->
  </div>

  <!-- 3. HALAMAN GURU -->
  <div class="dashboard hidden" id="dashboard-guru">
    <h2>Dashboard Guru</h2>
    <p>Selamat datang, <span id="namaGuru"></span></p>
    <button onclick="logout()" class="danger">Logout</button>
    <!-- nanti isi absen disini -->
  </div>

  <!-- 4. HALAMAN SISWA -->
  <div class="dashboard hidden" id="dashboard-siswa">
    <h2>Dashboard Siswa</h2>
    <p>Selamat datang, <span id="namaSiswa"></span></p>
    <button onclick="logout()" class="danger">Logout</button>
    <!-- nanti isi absen disini -->
  </div>


<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyPVBSWsLDyWK4d9sRRyCAnD8YSb-u2oAaGXqZuO5VGB4SjM3QQJGzoO9WlZUeTFf3e/exec";
  let currentUser = null;

  // FUNGSI LOGIN
  function login(){
    const role = document.getElementById('role').value;
    const user = document.getElementById('user').value;
    const pass = document.getElementById('pass').value;
    document.getElementById('error').innerText = "";

    fetch(`${SCRIPT_URL}?action=login&role=${role}&user=${user}&pass=${pass}`)
    .then(res => res.json())
    .then(data => {
      if(data.status == "sukses"){
        currentUser = data;
        document.getElementById('login').classList.add('hidden');

        if(role == 'admin'){
          document.getElementById('adminMenu').classList.remove('hidden');
        } else {
          document.getElementById('dashboard-'+role).classList.remove('hidden');
          if(role == 'guru') document.getElementById('namaGuru').innerText = data.nama;
          if(role == 'siswa') document.getElementById('namaSiswa').innerText = data.nama;
        }
      } else {
        document.getElementById('error').innerText = "Username atau Password salah";
      }
    }).catch(err => document.getElementById('error').innerText = "Error koneksi");
  }

  function logout(){
    location.reload();
  }

  // FUNGSI ADMIN
  function showKelola(jenis){
    document.getElementById('kelolaArea').innerHTML = `
      <h3>Kelola ${jenis.toUpperCase()}</h3>
      <input id="namaBaru" placeholder="Nama Lengkap">
      <input id="userBaru" placeholder="Username/NIS">
      <input id="passBaru" placeholder="Password">
      <button onclick="tambahData('${jenis}')">Tambah Data</button>
      <div id="tabel${jenis}">Loading...</div>
    `;
    loadTabel(jenis);
  }

  function tambahData(jenis){
    const nama = document.getElementById('namaBaru').value;
    const user = document.getElementById('userBaru').value;
    const pass = document.getElementById('passBaru').value;
    if(nama == "" || user == "" || pass == "") return alert("Isi semua");

    fetch(`${SCRIPT_URL}?action=tambah&jenis=${jenis}&nama=${nama}&user=${user}&pass=${pass}`)
    .then(res => res.json()).then(data => { 
      alert(data.pesan); 
      loadTabel(jenis); 
      document.getElementById('namaBaru').value = "";
      document.getElementById('userBaru').value = "";
      document.getElementById('passBaru').value = "";
    })
  }

  function loadTabel(jenis){
    fetch(`${SCRIPT_URL}?action=lihat&jenis=${jenis}`)
    .then(res => res.json()).then(data => {
      let html = "<table><tr><th>Nama</th><th>Username</th><th>Aksi</th></tr>";
      data.forEach(d => {
        html += `<tr><td>${d.nama}</td><td>${d.user}</td>
        <td><button class="danger" onclick="hapusData('${jenis}','${d.user}')">Hapus</button></td></tr>`;
      })
      document.getElementById('tabel'+jenis).innerHTML = html + "</table>";
    })
  }

  function hapusData(jenis, id){
    if(confirm("Yakin mau hapus "+id+"?")){
      fetch(`${SCRIPT_URL}?action=hapus&jenis=${jenis}&id=${id}`)
      .then(res => res.json()).then(data => { alert(data.pesan); loadTabel(jenis); })
    }
  }

</script>
</body>
</html>
